# ═══════════════════════════════════════════════════════════════════════════════
# Robustness Test Suite Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# Run from project root:  python robust_tests/run_tests.py
#
# All paths are relative to the project root (parent of this file's directory).
# The test suite runs ONE robot at a time. Change robot_config to test another.
# ═══════════════════════════════════════════════════════════════════════════════

# Robot to test
robot_config: robots/robot_leap.yaml

# Global metric config
metric_config: karma_config.yaml

# Override max_states for faster test runs (null = use config default).
# The baseline and all tests use this value so results are comparable.
max_states_override: 1000

# Output directory for results (relative to project root)
results_dir: robust_tests/results


# ── Group 1: Exact Invariance ────────────────────────────────────────────────
# These tests check properties that should hold EXACTLY.
# Any deviation indicates a bug or design flaw.

invariance:
  # 1.1 Translation invariance: shift the entire robot in world frame.
  #     Metric scores must be identical to baseline.
  translations_m:
    - [1.0, 0.0, 0.0]
    - [0.0, 2.5, 0.0]
    - [0.0, 0.0, -0.5]
    - [0.3, -0.7, 1.2]

  # 1.2 Rotation invariance: rotate the entire robot in world frame.
  #     Base pose canonicalization undoes the rotation before FK.
  #     Values are roll-pitch-yaw in degrees.
  rotations_rpy_deg:
    - [0, 0, 45]
    - [0, 90, 0]
    - [30, 0, 0]
    - [15, 30, 45]

  # 1.3 Scale invariance: uniformly scale the robot AND all length parameters.
  #     Metric scores must be identical to baseline.
  scale_factors: [0.5, 2.0]

  # 1.4 Finger swap invariance: swap thumb/index labels.
  #     Metric scores must be identical to baseline.
  test_finger_swap: true


# ── Group 2: Stability ───────────────────────────────────────────────────────
# These tests check that small perturbations produce proportionally small
# changes in the metric score (Lipschitz-like continuity).

stability:
  # 2.1 Link length perturbation: scale all joint origin translations by (1+eps).
  #     Simulates manufacturing tolerances.
  link_length_epsilons: [0.01, -0.01, 0.02, -0.02]

  # 2.2 Joint limit perturbation: widen (+) or narrow (-) all active joint
  #     limits by this many degrees.
  joint_limit_deltas_deg: [1.0, -1.0, 3.0, -3.0]

  # 2.3 Sphere radius perturbation: scale sphere_radius_m by (1+eps).
  sphere_radius_epsilons: [0.02, -0.02, 0.05, -0.05]

  # 2.4 Seed determinism: run the metric N times and verify identical results.
  seed_determinism_repeats: 3

  # 2.5 Link radius perturbation: scale link_radius_m by (1+eps).
  link_radius_epsilons: [0.02, -0.02, 0.05, -0.05]


# ── Group 3: Numerical ───────────────────────────────────────────────────────
# These tests verify computational reproducibility.

numerical:
  # 3.1 Determinism: run metric N times, results must be bit-for-bit identical.
  determinism_repeats: 3



# ── Group 4: Characterization Surveys ────────────────────────────────────────
# These tests don't check pass/fail — they produce data tables for analysis.

characterization:
  # 4.1 L_ref survey: compute reference length for multiple robots.
  #     L_ref = mxPr + mF (max pairwise knuckle distance + median finger wire).
  lref_robots:
    - robots/robot_allegro.yaml
    - robots/robot_ARMS_skel.yaml
    - robots/robot_shadowhand.yaml
    - robots/robot_leap.yaml
    - robots/robot_inspire.yaml
    - robots/robot_dex3.yaml
    - robots/robot_dclaw.yaml
    - robots/robot_sharpa.yaml

  # 4.2 Step size sensitivity: run with different step_size fractions of voxel_size.
  #     Fraction 0.125 = 8 sub-steps per voxel move (current default).
  step_size_fractions: [0.25, 0.125, 0.0625]

  # 4.3 BFS budget sensitivity: run with different max_voxels (Phase 1 limit).
  #     Default is 10000. Values here test saturation behavior.
  max_states_values: [500, 1000, 2000, 5000, 10000]
