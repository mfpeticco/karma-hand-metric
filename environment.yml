# KaRMA reproducible conda environment.
#
# Build:  conda env create -f environment.yml   (or: mamba env create -f environment.yml)
# Check:  python run_metric.py --config robots/robot_inspire.yaml
#
# pinocchio and hpp-fcl come from the PyPI cmeel wheels ("pin", "hpp-fcl"), which
# is what the published numbers were generated with. numpy/scipy/osqp/hpp-fcl/
# healpy are pinned because the metric counts voxels across discrete feasibility
# thresholds, so solver-level differences can move a boundary voxel.
# The metric is CPU-only: there is no GPU or torch dependency.
#
# On reproducibility: these pins make runs bit-identical on a given machine, and
# the published table was produced on x86-64 Linux. A different BLAS backend
# (e.g. Apple Accelerate on arm64 macOS) can still shift a hand by a voxel or
# two: Shadow scores 110 on the reference Linux box and 112 on an M-series Mac
# with these exact pins. Rankings are unaffected. See README "Reproducibility".
name: karma-hand-metric
channels:
  - conda-forge
dependencies:
  - python=3.10.18
  - pip
  - pip:
      # --- direct project dependencies (numerically sensitive: pinned exact) ---
      - numpy==1.26.4
      - scipy==1.15.3
      - pin==2.7.0          # pinocchio (PyPI cmeel wheel)
      - hpp-fcl==2.4.4
      - osqp==1.1.1
      - healpy==1.19.0
      - viser==1.0.24
      - matplotlib==3.10.9   # figures/plot scripts only; not used by the metric
      - yourdfpy==0.0.60     # interactive tools/ only (mesh overlay/tuning); not used by the metric
      - trimesh==4.12.2      # interactive tools/ only (mesh loading); not used by the metric
      - PyYAML==6.0.2
      # --- pinned transitive dependencies (full lock) ---
      - anyio==4.14.1
      - astropy==6.1.7
      - astropy-iers-data==0.2026.6.22.1.23.34
      - attrs==26.1.0
      - certifi==2026.6.17
      - charset-normalizer==3.4.7
      - cmeel==0.60.1
      - cmeel-assimp==5.4.3.1
